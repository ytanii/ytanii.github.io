<script>
    // Remember the theme choice across pages; only stored when it differs from the system theme
    const toggle = document.getElementById("theme");
    const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
    try {
        const saved = localStorage.getItem("theme");
        toggle.checked = saved !== null && (saved === "dark") !== systemDark;
        toggle.addEventListener("change", () => {
            if (toggle.checked) localStorage.setItem("theme", systemDark ? "light" : "dark");
            else localStorage.removeItem("theme");
        });
    } catch {}
</script>
